name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + tests + contract)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
      FLASK_ENV: testing
      SECRET_KEY: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install deps
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .
      - name: Run migrations
        working-directory: backend
        run: |
          flask --app wsgi db upgrade || echo "(no migrations yet)"
      - name: Tests
        working-directory: backend
        run: pytest
      - name: Contract tests
        working-directory: backend
        run: pytest tests/contract

  frontend:
    name: Frontend (lint + test + build + gen-client diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci || npm install
      - name: Gen client
        working-directory: frontend
        run: npm run gen:client
      - name: Check generated client has no diff
        run: |
          if [[ -n "$(git status --porcelain frontend/src/api/generated)" ]]; then
            echo "Generated client divergiu. Rode 'make gen-client' localmente."
            git diff --exit-code frontend/src/api/generated
            exit 1
          fi
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  openapi:
    name: OpenAPI lint (Spectral)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint openapi.yaml
        run: npx --yes @stoplight/spectral-cli lint specs/openapi.yaml